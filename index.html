<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#87ceeb">
  <meta name="description" content="Игра-тренажёр по признакам делимости: помоги лягушке добраться до дома!">
  <title>Лягушка и признаки делимости</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== ГЛАВНОЕ МЕНЮ ===== -->
  <div id="menu-screen" class="screen active">
    <div class="menu-wrap">
      <h1>🐸 Признаки делимости</h1>
      <p class="subtitle">Помоги лягушке добраться до дома!</p>
      <div class="menu-buttons">
        <button class="level-btn" data-level="1">
          <span class="level-icon">1️⃣</span>
          <span class="level-name">Признаки от 1 до 10</span>
        </button>
        <button class="level-btn" data-level="2">
          <span class="level-icon">2️⃣</span>
          <span class="level-name">Признаки от 10 до 20</span>
        </button>
        <button class="level-btn" data-level="3">
          <span class="level-icon">3️⃣</span>
          <span class="level-name">Остальные признаки</span>
        </button>
        <button class="level-btn" data-level="4">
          <span class="level-icon">🏆</span>
          <span class="level-name">Все признаки</span>
        </button>
      </div>
      <div class="menu-bottom">
        <button id="open-dictionary" class="menu-extra-btn">📖 Словарик</button>
        <button id="open-home" class="menu-extra-btn">🏠 Домик лягушек</button>
      </div>
    </div>
  </div>

  <!-- ===== ИГРА ===== -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <button id="back-to-menu" class="back-btn">← Меню</button>
      <div class="game-stats">
        <span id="jump-counter">Кувшинка 0 / 10</span>
        <span id="mistake-counter">Ошибки: 0</span>
      </div>
    </div>
    <div class="pond-container">
      <div class="pond" id="pond">
        <div class="pond-inner" id="pond-inner"></div>
      </div>
    </div>
    <div class="question-panel">
      <div id="question-text" class="question-text"></div>
      <div class="answer-buttons">
        <button id="btn-yes" class="answer-btn yes">Да</button>
        <button id="btn-no" class="answer-btn no">Нет</button>
      </div>
      <button id="btn-dont-know" class="dont-know-btn">Я не знаю</button>
      <div id="feedback" class="feedback"></div>
      <div id="theory-prompt" class="theory-prompt hidden">
        <p>Хотите посмотреть теорию?</p>
        <button id="btn-show-theory" class="theory-btn">Посмотреть теорию</button>
        <button id="btn-skip-theory" class="theory-btn skip">Не надо</button>
      </div>
    </div>
  </div>

  <!-- ===== РЕЗУЛЬТАТ ===== -->
  <div id="result-screen" class="screen">
    <div class="result-content">
      <h2 id="result-title"></h2>
      <div id="result-frog" class="result-frog"></div>
      <p id="result-text"></p>
      <button id="result-back-to-menu" class="primary-btn">В меню</button>
    </div>
  </div>

  <!-- ===== СЛОВАРИК ===== -->
  <div id="dictionary-modal" class="modal hidden">
    <div class="modal-content book">
      <div class="book-header">
        <span>📖 Словарик признаков делимости</span>
        <button class="modal-close" id="close-dictionary">✕</button>
      </div>
      <div class="book-body">
        <div class="book-tabs" id="book-tabs"></div>
        <div class="book-page-wrap">
          <div class="book-page" id="book-page"></div>
          <div class="book-nav">
            <button id="book-prev" class="book-nav-btn">◀ Назад</button>
            <span id="book-page-indicator"></span>
            <button id="book-next" class="book-nav-btn">Вперёд ▶</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== ДОМИК ===== -->
  <div id="home-modal" class="modal hidden">
    <div class="modal-content home-content">
      <div class="book-header">
        <span>🏠 Домик лягушек</span>
        <button class="modal-close" id="close-home">✕</button>
      </div>
      <div id="home-frogs" class="home-frogs"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
